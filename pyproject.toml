description = "Local coordination bridge between ChatGPT and Codex."
requires-python = ">=3.13"
dependencies = [
    "mcp>=2,<3",
]

[project.scripts]
chatgpt-codex-bridge-mcp = "chatgpt_codex_bridge.mcp_server:main"

[tool.chatgpt_codex_bridge]
source_root = "src"
